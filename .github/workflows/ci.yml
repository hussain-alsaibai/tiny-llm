name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile tiny_llm.py
      - name: Unit tests
        run: |
          python -c "
          from tiny_llm import LLM, StreamChunk, LLMResponse, COST_PER_MILLION
          print('Import OK')
          print(f'Providers: {list(COST_PER_MILLION.keys())[:5]}...')
          print(f'Models: {len(COST_PER_MILLION)} entries')
          # Smoke test providers
          from tiny_llm import OpenAIProvider, AnthropicProvider, OllamaProvider
          p = OpenAIProvider('test-key')
          print('OpenAI provider OK')
          p = AnthropicProvider('test-key')
          print('Anthropic provider OK')
          p = OllamaProvider()
          print('Ollama provider OK')
          "
